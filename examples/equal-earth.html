<!DOCTYPE html>
<!-- geopbf で Equal Earth の世界図を描くデモ（サーバ無し・データはブラウザが直に取る）。
     Natural Earth 10m の shapefile（zip）を naturalearth.s3.amazonaws.com（CORS: *）から fetch し、
     geopbf の shape decoder（worker）で GeoPBF に変換してから extension/preview.js で canvas に重ね描きする。
     図法＝modules/projections.js の geoEqualEarth（Šavrič–Patterson–Jenny 2018・等積）。

     起動: リポジトリルートを静的配信して開く（`npx vite` でも `python3 -m http.server` でも可・裸の import は
     一つも無いのでバンドラは要らない）→ /examples/equal-earth.html
     file:// は不可・他の例と違って esm.sh も不可＝decoder は module worker で動き、worker のスクリプトは
     同一オリジンでなければブラウザが拒むため（src/ を同じオリジンから配る）。

     初回は 10m の 4 層で約 8.7 MB を取りに行く（以後はブラウザの HTTP キャッシュ）。
     中央経線はスライダで振れる。幾何は切り直さない＝preview の repeat（世界を ±360° ずらして重ね描きし図郭で切り抜く）。

     見た目と操作は apps/equal と同じ。違いは中身で、あちらは焼いた data.json を素の canvas で描く「配る側」、
     こちらは実データを毎回ブラウザで変換してライブラリの描き口（preview）に通す「ライブラリを通す側」。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal Earth 10m — geopbf</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
	:root {
		--ground: #f7f4ee; --ink: #23282c; --dim: #6b7378; --rule: #ddd6c9;
		--ocean: #dae8f2; --land: #f2ece0; --coast: #8c8371; --lake: #cbe0ee; --river: #8fb6d2;
		--border: #a4977f; --grat: #b8ccd9; --neat: #6a767e; --accent: #b4552d;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--ground: #101418; --ink: #e8e4dc; --dim: #93a0a8; --rule: #253038;
			--ocean: #15232e; --land: #353d45; --coast: #93a2ac; --lake: #1d3746; --river: #3f6b88;
			--border: #7b7161; --grat: #26404f; --neat: #55646e; --accent: #d97f4f;
		}
	}
	:root[data-theme="dark"] {
		--ground: #101418; --ink: #e8e4dc; --dim: #93a0a8; --rule: #253038;
		--ocean: #15232e; --land: #353d45; --coast: #93a2ac; --lake: #1d3746; --river: #3f6b88;
		--border: #7b7161; --grat: #26404f; --neat: #55646e; --accent: #d97f4f;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body { margin: 0; background: var(--ground); color: var(--ink); display: flex; flex-direction: column;
		font: 400 14px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; }
	header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 10px 16px 8px;
		border-bottom: 1px solid var(--rule); }
	h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
	h1 span { color: var(--dim); font-weight: 400; }
	.spacer { flex: 1 1 auto; }
	.layers { display: flex; flex-wrap: wrap; gap: 4px 12px; }
	label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; color: var(--dim); }
	label input { accent-color: var(--accent); margin: 0; }
	.key { width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(128,128,128,.4); }
	.meridian { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 200px; }
	.meridian input[type=range] { flex: 1 1 auto; accent-color: var(--accent); min-width: 120px; }
	output, .num { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 13px; }
	button { font: inherit; font-size: 13px; padding: 2px 10px; border: 1px solid var(--rule); border-radius: 4px;
		background: transparent; color: var(--dim); cursor: pointer; }
	button:hover { color: var(--ink); border-color: var(--dim); }
	main { flex: 1 1 auto; min-height: 0; position: relative; padding: 0 16px; }
	canvas { position: absolute; inset: 0 16px; width: calc(100% - 32px); height: 100%; }
	footer { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 16px; border-top: 1px solid var(--rule);
		font-size: 12px; color: var(--dim); }
	a { color: var(--accent); }
	@media (max-width: 560px) { h1 { width: 100%; } .layers { order: 3; } }
</style>
</head>
<body>
<header>
	<h1>Equal Earth <span>· Natural Earth 10m（ブラウザで変換）</span></h1>
	<div class="meridian">
		<label for="lon0" style="color:var(--dim)">中央経線</label>
		<input id="lon0" type="range" min="-180" max="180" step="1" value="0" aria-label="中央経線">
		<output id="lon0v" for="lon0">0°</output>
	</div>
	<div class="spacer"></div>
	<div class="layers" id="layers"></div>
	<button id="png">PNG</button>
</header>
<main><canvas id="cv"></canvas></main>
<footer>
	<span id="status" class="num">読み込み中…</span>
	<span id="readout" class="num">カーソルの位置：—</span>
	<span>図法: Equal Earth（Šavrič, Patterson &amp; Jenny 2018）・等積</span>
	<span>データ: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noreferrer">Natural Earth</a> 10m（public domain）</span>
</footer>

<script type="module">
import { createGeopbf } from "../src/index.js";
import { preview } from "../src/extension/preview.js";
import { geoEqualEarth } from "../src/modules/projections.js";

// createGeopbf() を引数無しで呼ぶ＝素の provider（直 fetch・キャッシュ無し）。私有 API は一切使わない。
const geopbf = createGeopbf();
// 図法は自分で持って preview に渡す＝描いた後も scale/translate 込みで手元に残る＝invert で画面→経緯度が引ける
const proj = geoEqualEarth();

// 取得元は Natural Earth 公式の S3（CORS: *）。?ne=<base> で自前ミラーにも向けられる（末尾 / 付き・以下の相対パスは同じ）。
const NE = new URLSearchParams(location.search).get("ne") || "https://naturalearth.s3.amazonaws.com/";

// 描く順に並べた層。url 付き＝Natural Earth の shapefile、gen 付き＝その場で作る幾何（経緯線）。
// 図郭（海の塗りと外枠）は層ではなく preview の outline＝図法が決める形でデータではない。
const LAYERS = [
	{ id: "graticule",  name: "経緯線", gen: graticule, key: "--grat",   fill: null,     stroke: "--grat",   w: 0.6 },
	{ id: "land",       name: "陸地",   url: NE + "10m_physical/ne_10m_land.zip",                        key: "--land",   fill: "--land", stroke: "--coast",  w: 0.6 },
	{ id: "lakes",      name: "湖",     url: NE + "10m_physical/ne_10m_lakes.zip",                       key: "--lake",   fill: "--lake", stroke: "--river",  w: 0.4 },
	{ id: "rivers",     name: "河川",   url: NE + "10m_physical/ne_10m_rivers_lake_centerlines.zip",     key: "--river",  fill: null,     stroke: "--river",  w: 0.6 },
	{ id: "boundaries", name: "国境",   url: NE + "10m_cultural/ne_10m_admin_0_boundary_lines_land.zip", key: "--border", fill: null,     stroke: "--border", w: 0.7 },
];

// 経緯線＝30° ごと。子午線は 1° 刻み、緯線は 2° 刻みで打つ（±90° の極線と窓の縁は図郭＝outline が描く）。
// 中央経線に依らず経緯度のまま 1 度作るだけ＝振るのは描画側（repeat）の仕事。
function graticule() {
	const g = [];
	for (let lon = -150; lon <= 180; lon += 30) {
		const c = []; for (let lat = -90; lat <= 90; lat++) c.push([lon, lat]);
		g.push({ type: "LineString", coordinates: c });
	}
	for (let lat = -60; lat <= 60; lat += 30) {
		const c = []; for (let lon = -180; lon <= 180; lon += 2) c.push([lon, lat]);
		g.push({ type: "LineString", coordinates: c });
	}
	return { type: "FeatureCollection", features: g.map(t => ({ type: "Feature", properties: {}, geometry: t })) };
}

// gint:false＝identify 用の位相は焼かない（この図は描くだけ）。nocache:true＝IndexedDB を触らない。
const load = (src, name) => geopbf(src, { name, gint: false, nocache: true });

const cv = document.getElementById("cv"), statusEl = document.getElementById("status");
const shown = new Map();   // id → 描く GeoPBF
let blank;                 // 地物ゼロの GeoPBF＝図郭（outline）だけを描くための器
let lon0 = 0, lastDraw = 0;
const say = msg => { statusEl.textContent = msg; };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

async function boot() {
	blank = await load({ type: "FeatureCollection", features: [] }, "frame");
	for (const l of LAYERS) if (l.gen) shown.set(l.id, await load(l.gen(), l.id));
	draw();
	const t0 = performance.now();
	let done = 0, features = 0;
	const urls = LAYERS.filter(l => l.url);
	await Promise.all(urls.map(async l => {
		const t = performance.now();
		try {
			const pbf = await load(l.url, l.id);
			shown.set(l.id, pbf);
			features += pbf.length;
			console.log(`[equal-earth] ${l.id}: ${pbf.length} features, ${(performance.now() - t).toFixed(0)} ms`);
		} catch (e) {
			console.error(`[equal-earth] ${l.id}:`, e);
			l.failed = true;
		}
		say(`読み込み中… ${++done}/${urls.length}`);
		draw();
	}));
	const failed = LAYERS.filter(l => l.failed).map(l => l.name);
	say(`${features.toLocaleString("en-US")} features を ${((performance.now() - t0) / 1000).toFixed(1)} s で取得・変換`
		+ (failed.length ? `（取得できなかった層: ${failed.join(", ")}）` : "") + ` — 描画 ${lastDraw.toFixed(0)} ms`);
}

// ── 描画 ──────────────────────────────────────────────────────────────────────
// 1 枚の canvas に preview() を層の数だけ重ねる。bbox を全層で同じ（中央経線 λ0 の窓）にする＝同じ scale・同じ中心で載る。
// データの層は repeat:true＝preview が世界を ±360° ずらして 3 回描き、図郭で切り抜く。中央経線をどこへ振っても
// 縫い目を跨ぐ地物が途切れず、**幾何は切り直さない**（＝取り直しも再エンコードも無しで即座に振れる）。
function draw() {
	const dpr = Math.min(devicePixelRatio || 1, 2), box = cv.getBoundingClientRect();
	cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
	const ctx = cv.getContext("2d");
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.clearRect(0, 0, cv.width, cv.height);
	const t0 = performance.now();
	const base = { projection: proj, bbox: [lon0 - 180, -90, lon0 + 180, 90], dpr, repeat: true, minDist: 0.6, radius: 0.8 };
	preview(blank, cv, { ...base, outline: { fill: css("--ocean") } });                     // 海＝図郭の塗り（いちばん下）
	for (const l of LAYERS) {
		const pbf = shown.get(l.id);
		if (!pbf || l.off) continue;
		preview(pbf, cv, { ...base, fill: l.fill ? css(l.fill) : "transparent", stroke: css(l.stroke), lineWidth: l.w });
	}
	preview(blank, cv, { ...base, outline: { stroke: css("--neat"), lineWidth: 1 } });      // 外枠（いちばん上）
	lastDraw = performance.now() - t0;
}

// ── 操作 ──────────────────────────────────────────────────────────────────────
const layersEl = document.getElementById("layers");
for (const l of LAYERS) {
	const label = document.createElement("label");
	label.innerHTML = `<input type="checkbox" id="chk-${l.id}" checked><span class="key" style="background:var(${l.key})"></span>${l.name}`;
	label.querySelector("input").addEventListener("change", e => { l.off = !e.target.checked; draw(); });
	layersEl.append(label);
}
const lon0v = document.getElementById("lon0v");
document.getElementById("lon0").addEventListener("input", e => {
	lon0 = +e.target.value;
	lon0v.textContent = lon0 > 0 ? `${lon0}°E` : lon0 < 0 ? `${-lon0}°W` : "0°";
	draw();                 // データも図郭も作り直さない＝描き直すだけ
});
// 逆変換＝カーソルの経緯度。preview に渡した図法がそのまま手元にあるので invert がそのまま引ける
const readout = document.getElementById("readout");
cv.addEventListener("pointermove", e => {
	const box = cv.getBoundingClientRect();
	const [lon, lat] = proj.invert([e.clientX - box.left, e.clientY - box.top]);
	const wrapped = ((lon + 180) % 360 + 360) % 360 - 180;
	const inside = Math.abs(lat) <= 90.0001 && Math.abs(lon - lon0) <= 180.0001;
	readout.textContent = inside
		? `カーソルの位置：${Math.abs(lat).toFixed(2)}°${lat >= 0 ? "N" : "S"}  ${Math.abs(wrapped).toFixed(2)}°${wrapped >= 0 ? "E" : "W"}`
		: "カーソルの位置：図郭の外";
});
cv.addEventListener("pointerleave", () => { readout.textContent = "カーソルの位置：—"; });
document.getElementById("png").addEventListener("click", () => cv.toBlob(b => {
	const a = document.createElement("a");
	a.href = URL.createObjectURL(b); a.download = `equal-earth-${lon0}.png`; a.click();
	setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}));
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

boot();
</script>
</body>
</html>
